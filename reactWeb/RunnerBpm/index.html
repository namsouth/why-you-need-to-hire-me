<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="RunnerBpm - Cadence Metronome Trainer" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>RunnerBpm</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="h-full bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300">
  <div id="app" class="h-full flex flex-col"></div>

  <!-- Utils -->
  <script src="js/utils/timeUtils.js"></script>
  <script src="js/utils/tailwindHelper.js"></script>

  <!-- Models -->
  <script src="js/models/settingsModel.js"></script>
  <script src="js/models/historyModel.js"></script>

  <!-- Services -->
  <script src="js/services/storageService.js"></script>
  <script src="js/services/audioService.js"></script>
  <script src="js/services/metronomeService.js"></script>

  <!-- Components -->
  <script src="js/components/Header.js"></script>
  <script src="js/components/Summary.js"></script>
  <script src="js/components/Feet.js"></script>
  <script src="js/components/Actions.js"></script>
  <script src="js/components/SettingsModal.js"></script>
  <script src="js/components/HistoryModal.js"></script>
  <script src="js/components/Footer.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>

  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered', reg.scope))
          .catch(err => console.log('SW registration failed', err));
      });
    }
  </script>
</body>
</html>
